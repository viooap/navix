<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 GPS Tracker Realtime</title>
    
    <!-- CSS Leaflet untuk Tampilan Peta -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100%; position: absolute; top: 0; bottom: 0; z-index: 1; }
        .info-box {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: white; padding: 10px 15px; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Kotak Status Informasi -->
    <div class="info-box">
        <b>GPS Tracker Status:</b> <span id="status" style="color: orange;">Memuat Peta...</span>
    </div>

    <!-- Wadah Peta -->
    <div id="map"></div>

    <!-- JS Leaflet (Dimuat lebih dulu agar peta pasti muncul) -->
    <script src="https://unpkg.com"></script>

    <!-- Library Firebase Versi Ringan (8.x.x Compat) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // 1. Inisialisasi Peta Duluan Agar Tidak Putih Polos
        const defaultPos = [-6.17511, 106.86503]; // Jakarta Pusat
        const map = L.map('map').setView(defaultPos, 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker(defaultPos).addTo(map);
        marker.bindPopup("<b>Menunggu Sinyal GPS...</b>").openPopup();
        
        document.getElementById('status').innerText = "Menghubungkan ke Firebase...";

        // 2. Konfigurasi Firebase Proyek Anda
        const firebaseConfig = {
            apiKey: "AIzaSyB5rITD9OxYNDvQFZgE4NxMzro_MzSswb8",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "fixselesai-fde60",
            storageBucket: "fixselesai-fde60.firebasestorage.app",
            messagingSenderId: "666302669881",
            appId: "1:666302669881:web:b65fdba496c55c015199e9"
        };
        
        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 3. Mengambil data secara Real-time
        const gpsRef = database.ref('tracker');
        
        gpsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const statusText = document.getElementById('status');

            if (data && data.lat && data.lng) {
                const newPos = [data.lat, data.lng];
                
                marker.setLatLng(newPos);
                map.panTo(newPos);
                marker.bindPopup(`<b>Lokasi Alat Tracker</b><br>Lat: ${data.lat}<br>Lng: ${data.lng}`).openPopup();
                
                statusText.innerText = "Aktif (Menerima Data)";
                statusText.style.color = "green";
            } else {
                statusText.innerText = "Terhubung, Menunggu Koordinat ESP32...";
                statusText.style.color = "blue";
            }
        }, (error) => {
            console.error(error);
            document.getElementById('status').innerText = "Gagal memuat database!";
            document.getElementById('status').style.color = "red";
        });
    </script>
</body>
</html>
