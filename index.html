<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 GPS Tracker Realtime</title>
    <!-- CSS Leaflet untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- SDK Firebase (Gunakan versi tumpukan/compat agar mudah) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <!-- JS Leaflet -->
    <script src="https://unpkg.com"></script>

    <script>
        // 1. Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "proyek-gps",
            storageBucket: "://appspot.com",
        };
        
        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. Inisialisasi Peta Leaflet (Default koordinat Jakarta)
        const map = L.map('map').setView([-6.200000, 106.816666], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Buat penanda (marker) peta
        let marker = L.marker([-6.200000, 106.816666]).addTo(map);

        // 3. Ambil data dari Firebase secara Real-time
        const gpsRef = database.ref('tracker');
        gpsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if(data && data.lat && data.lng) {
                const newPos = [data.lat, data.lng];
                
                // Update posisi marker dan geser peta ke lokasi baru
                marker.setLatLng(newPos);
                map.panTo(newPos);
                marker.bindPopup(`<b>Lokasi Tracker</b><br>Lat: ${data.lat}<br>Lng: ${data.lng}`).openPopup();
            }
        });
    </script>
</body>
</html>
