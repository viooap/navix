<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 GPS Tracker</title>
    
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        #map {
            height: 75vh; /* Peta memakan 75% tinggi layar */
            width: 100%;
        }
        #info-panel {
            padding: 15px;
            background: #f4f4f4;
            text-align: center;
            font-size: 16px;
        }
        .koordinat {
            font-weight: bold;
            color: #007BFF;
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>Real-Time ESP32 GPS Tracker</h2>
    </div>

    <!-- Kontainer Peta -->
    <div id="map"></div>

    <!-- Panel Informasi Koordinat -->
    <div id="info-panel">
        <p>Latitude: <span id="lat" class="koordinat">Menghubungkan...</span> | 
           Longitude: <span id="lng" class="koordinat">Menghubungkan...</span></p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com"></script>

    <!-- Firebase SDK (v9 ke atas) -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, onValue } from "https://gstatic.com";

        // 1. PASTE KONFIGURASI FIREBASE ANDA DI SINI
        const firebaseConfig = {
  apiKey: "AIzaSyB5riZD9OxYN0vQEIgEANxWznp_WzSawb8",
  authDomain: "fixselesai-fde60.firebaseapp.com",
  databaseURL: "https://fixselesai-fde60-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fixselesai-fde60",
  storageBucket: "fixselesai-fde60.firebasestorage.app",
  messagingSenderId: "666302669881",
  appId: "1:666302669881:web:b65fdba496c55d015199e8"
};

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 2. Inisialisasi Peta Leaflet (Default awal ke Jakarta sebelum data masuk)
        const map = L.map('map').setView([-6.2088, 106.8456], 13);
        
        // Menggunakan OpenStreetMap layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Buat marker (penanda) di peta yang nantinya posisinya akan berubah
        let marker = L.marker([-6.2088, 106.8456]).addTo(map);

        // 3. Baca data dari Firebase secara Real-Time
        // Sesuaikan 'GPS_Data' dengan nama node/path di database Firebase Anda
        const gpsRef = ref(database, 'GPS_Data'); 
        
        onValue(gpsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const latitude = data.latitude;
                const longitude = data.longitude;

                // Update teks di panel informasi
                document.getElementById('lat').innerText = latitude;
                document.getElementById('lng').innerText = longitude;

                // Update posisi marker dan arahkan peta ke lokasi baru
                const newLocation = new L.LatLng(latitude, longitude);
                marker.setLatLng(newLocation);
                map.setView(newLocation, 16); // Angka 16 adalah level zoom
            } else {
                console.log("Data tidak ditemukan di Firebase.");
            }
        });
    </script>
</body>
</html>
