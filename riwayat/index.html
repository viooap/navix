<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - Riwayat Perjalanan</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan Font Awesome untuk ikon perangkat & tombol -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo"><i class="fa-solid fa-location-dot"></i> GeoTrack</a>
            <ul class="nav-menu">
                <li><a href="#">Dashboard</a></li>
                <li><a href="#" class="active">Riwayat</a></li>
                <li><a href="#">Perangkat</a></li>
                <li><a href="#">Pengaturan</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="main-container">
        <header class="dashboard-header">
            <h1>Riwayat Perjalanan</h1>
            <p>Lihat dan filter rekam jejak lokasi perangkat Anda.</p>
        </header>

        <!-- Filter Riwayat -->
        <div class="card filter-panel">
            <div class="filter-group">
                <label for="date-select"><i class="fa-solid fa-calendar-days"></i> Pilih Tanggal:</label>
                <input type="date" id="date-select" value="2026-09-05">
            </div>
            <div class="filter-group">
                <label for="device-select"><i class="fa-solid fa-car"></i> Perangkat:</label>
                <select id="device-select">
                    <option value="mobil-01">Kurir-Mobil-01</option>
                    <option value="motor-02">Kurir-Motor-02</option>
                </select>
            </div>
            <button class="btn-primary btn-filter" id="btn-tampilkan">Tampilkan data</button>
        </div>

        <!-- Grid Riwayat -->
        <div class="dashboard-grid">
            <!-- Tabel Data Riwayat -->
            <div class="card table-panel">
                <h2>Log Lokasi Terakhir</h2>
                <div class="table-responsive">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Koordinat</th>
                                <th>Kecepatan</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="history-log">
                            <!-- Data otomatis diisi oleh script.js -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Simulasi Visual Rute -->
            <div class="card map-panel">
                <h2>Visualisasi Rute</h2>
                <div class="map-placeholder">
                    <div class="route-line"></div>
                    <div class="ping-container pin-start">
                        <div class="pin-label">Mulai</div>
                        <i class="fa-solid fa-circle-dot map-marker-small"></i>
                    </div>
                    <div class="ping-container pin-end">
                        <div class="pin-label">Sekarang</div>
                        <div class="ping-pulse"></div>
                        <i class="fa-solid fa-car-side map-marker"></i>
                    </div>
                    <p class="coordinates">Total Jarak: 14.5 Km</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
